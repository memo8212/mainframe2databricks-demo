name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Generate synthetic mainframe extracts
        run: |
          python data/generate_mainframe_data.py
          python usecase-claims/data/generate_claims_data.py

      - name: Run converter (legacy -> Databricks artifacts)
        run: |
          python converter/mf2dbx_converter.py
          python usecase-claims/converter/convert_claims.py

      - name: EBCDIC / COMP-3 round-trip
        run: python runner/ebcdic_comp3_demo.py

      - name: Run end-to-end demo + validation
        run: python runner/run_demo.py

      - name: Run claims use case + validation
        run: python usecase-claims/runner/run_claims.py

      - name: mftranspile tests
        run: pytest -q tests/test_mftranspile.py

      - name: Convert COBOL -> PySpark and verify
        run: |
          python -m mftranspile convert \
            --cobol legacy/cobol/ACCTPOST.cbl \
            --copybook ACCTREC=legacy/copybook/ACCTREC.cpy \
            --jcl legacy/jcl/NIGHTLY_BATCH.jcl \
            --out build/
          python -m mftranspile verify \
            --module build/post_transactions.py \
            --data data \
            --legacy artifacts/output/legacy/account_master.csv

      - name: Show conversion report
        run: cat artifacts/generated/conversion_report.md
