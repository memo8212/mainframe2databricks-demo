name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Generate synthetic mainframe extracts
        run: python data/generate_mainframe_data.py

      - name: Run converter (legacy -> Databricks artifacts)
        run: python converter/mf2dbx_converter.py

      - name: Run end-to-end demo + validation
        run: python runner/run_demo.py

      - name: Show conversion report
        run: cat artifacts/generated/conversion_report.md
